<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mijnenveger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: tellers bovenaan, speelveld in het midden, graaf/vlag-knop onderaan, panelen erover */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --panel:#1d2440;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  --cell:32px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;touch-action:none;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
.top{width:100%;max-width:520px;height:44px;display:grid;grid-template-columns:40px 1fr 1fr 40px 40px;align-items:center;gap:6px}
.stat{text-align:center;line-height:1}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
#best{margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.stage{flex:1;width:100%;display:grid;place-items:center;min-height:0}
#board{display:grid;gap:2px;padding:2px;background:#2f3860;border-radius:4px;touch-action:none}
.c{width:var(--cell);height:var(--cell);display:grid;place-items:center;border-radius:3px;background:#2a3358;
  box-shadow:inset 0 -3px 0 #1d2440, inset 0 2px 0 #36406a;
  font-family:var(--display);font-size:calc(var(--cell) * .55);line-height:1;cursor:pointer}
.c.open{background:#10162a;box-shadow:none;cursor:default}
.c.boom{background:#c94747}
.c.wrong{background:#3a2a40}
.n1{color:#6cb6ff}.n2{color:#7bd88f}.n3{color:#ff7a7a}.n4{color:#b48cff}
.n5{color:#ffb347}.n6{color:#4fd1c5}.n7{color:#f4f0e6}.n8{color:#9097b5}
.c .ic{font-family:var(--body);font-size:calc(var(--cell) * .6)}
.mode{margin-top:12px;display:flex;gap:6px;width:100%;max-width:320px}
.mode button{flex:1;font-family:var(--body);font-weight:600;font-size:16px;padding:12px 6px;color:var(--fg);background:transparent;
  border:2px solid #2f3860;border-radius:4px;box-shadow:none;cursor:pointer}
.mode button[aria-pressed="true"]{color:var(--bg-deep);background:var(--accent);border-color:var(--accent)}
.home{width:40px;height:40px;display:grid;place-items:center;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);text-decoration:none;font-size:20px}
.home:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.restart{width:40px;height:40px;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);border:0;font-size:20px;cursor:pointer;padding:0}
/* de terugknop blijft boven de pop-ups, zodat je altijd naar het overzicht kunt */
.home{position:relative;z-index:5}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;background:rgba(11,15,29,.62)}
.overlay[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:28px 24px;max-width:320px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--bg-deep)}
.panel h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.ver{font-size:12px;color:var(--muted);letter-spacing:.08em}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.panel > button{font-family:var(--display);font-size:20px;color:var(--bg-deep);background:var(--accent);border:0;border-radius:4px;
  padding:14px 18px;cursor:pointer;box-shadow:0 5px 0 #b86e14}
.panel > button:active{transform:translateY(4px);box-shadow:0 1px 0 #b86e14}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.levels{display:flex;gap:6px}
.levels button{flex:1;font-family:var(--display);font-size:13px;padding:10px 2px;color:var(--fg);background:transparent;border:2px solid #2f3860;border-radius:4px;cursor:pointer}
.levels button[aria-pressed="true"]{color:var(--bg-deep);background:var(--accent);border-color:var(--accent)}
.panel > button.link{font-family:var(--body);font-size:14px;color:var(--muted);background:none;box-shadow:none;padding:4px;text-decoration:underline}
.panel > button.link:active{transform:none}
</style>
</head><body>

<div id="wrap">
  <div class="top">
    <a class="home" href="../../" aria-label="Terug naar alle games">&larr;</a>
    <div class="stat"><b id="left">0</b><span>Mijnen</span></div>
    <div class="stat"><b id="time">0</b><span>Tijd</span></div>
    <button class="sndbtn" aria-label="Geluid aan of uit"></button>
    <button class="restart" id="restart" aria-label="Opnieuw beginnen">&#8635;</button>
  </div>
  <div id="best">Record –</div>
  <div class="stage"><div id="board" role="grid" aria-label="Speelveld"></div></div>
  <div class="mode" role="group" aria-label="Wat doet een tik">
    <button id="dig" aria-pressed="true">&#9935;&#65039; Graven</button>
    <button id="flag" aria-pressed="false">&#128681; Vlag</button>
  </div>

  <div class="overlay" id="start">
    <div class="panel">
      <h1>Mijnenveger</h1>
      <p>Open alle vakjes zonder mijn. Een cijfer zegt hoeveel mijnen er rond dat vakje liggen. Houd een vakje ingedrukt of klik rechts voor een vlag.</p>
      <div class="levels" role="group" aria-label="Moeilijkheid">
        <button data-level="makkelijk">Makkelijk</button>
        <button data-level="normaal">Normaal</button>
        <button data-level="moeilijk">Moeilijk</button>
      </div>
      <button id="go">Start</button>
      <div class="ver">Versie <span id="ver"></span></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h1 id="overtitle">Gewonnen!</h1>
      <div class="big" id="final">0</div>
      <p id="overmsg">seconden</p>
      <button id="again">Opnieuw</button>
      <button class="link" id="change">Andere moeilijkheid</button>
    </div>
  </div>
</div>

<script src="../../version.js?v=5.0"></script>
<script>
const $=id=>document.getElementById(id);
try{$('ver').textContent=SITE_VERSION}catch(e){}

/* moeilijkheid: kolommen × rijen (staand scherm) en aantal mijnen */
const LEVELS={
  makkelijk:{cols:9, rows:9, mines:10,name:'Makkelijk'},
  normaal:  {cols:10,rows:14,mines:24,name:'Normaal'},
  moeilijk: {cols:12,rows:18,mines:45,name:'Moeilijk'},
};
const bestKey=l=>'mijnenveger-best-'+l;

let level='makkelijk'; try{const l=localStorage.getItem('mijnenveger-level');if(LEVELS[l])level=l}catch(e){}
let overTimer=null,cols,rows,mines,grid,cells,opened,flags,state='start',t0=0,elapsed=0,timer=null,flagMode=false,best=0;

function readBest(l){try{return +localStorage.getItem(bestKey(l))||0}catch(e){return 0}}
function showBest(){$('best').textContent='Record '+(best?best+' s':'–')+' · '+LEVELS[level].name;}
function setLevel(l){
  level=l;try{localStorage.setItem('mijnenveger-level',l)}catch(e){}
  best=readBest(l);showBest();
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.level===l));
}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{setLevel(b.dataset.level);reset();}));

/* geluid: kleine piep, start pas na de eerste tik */
let ac=null;
function beep(f,d=0.09,type='triangle',v=0.12){
  if(window.SITE_SOUND&&!SITE_SOUND.on)return;   // geluid uitgezet
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

// op een breed scherm draaien we het veld een kwartslag
function dims(){
  const L=LEVELS[level], wide=innerWidth>innerHeight;
  return wide?[L.rows,L.cols]:[L.cols,L.rows];
}
function fit(){
  const b=$('board'), top=$('wrap');
  const availW=Math.min(innerWidth-24,900), availH=innerHeight-top.querySelector('.top').offsetHeight-$('best').offsetHeight-
    top.querySelector('.mode').offsetHeight-60;
  const size=Math.floor(Math.min((availW-4)/cols-2,(availH-4)/rows-2,46));
  document.documentElement.style.setProperty('--cell',Math.max(18,size)+'px');
  b.style.gridTemplateColumns=`repeat(${cols},var(--cell))`;
}
addEventListener('resize',fit);

function reset(){
  [cols,rows]=dims();mines=LEVELS[level].mines;
  grid=[];for(let i=0;i<cols*rows;i++)grid.push({mine:false,n:0,open:false,flag:false});
  clearTimeout(overTimer);opened=0;flags=0;elapsed=0;state='ready';clearInterval(timer);timer=null;
  $('time').textContent=0;$('left').textContent=mines;
  const b=$('board');b.innerHTML='';cells=[];
  for(let i=0;i<cols*rows;i++){
    const d=document.createElement('div');d.className='c';d.dataset.i=i;d.setAttribute('role','gridcell');
    b.appendChild(d);cells.push(d);
  }
  fit();
}

const nb=i=>{const x=i%cols,y=(i-x)/cols,r=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;
    if(nx>=0&&ny>=0&&nx<cols&&ny<rows)r.push(ny*cols+nx);}
  return r;};

// mijnen pas leggen na de eerste tik, niet op of rond dat vakje
function layMines(safe){
  const keep=new Set([safe,...nb(safe)]), spots=[];
  for(let i=0;i<grid.length;i++)if(!keep.has(i))spots.push(i);
  for(let k=0;k<mines;k++){const j=k+Math.floor(Math.random()*(spots.length-k));[spots[k],spots[j]]=[spots[j],spots[k]];grid[spots[k]].mine=true;}
  for(let i=0;i<grid.length;i++)grid[i].n=nb(i).filter(j=>grid[j].mine).length;
}

function draw(i){
  const g=grid[i],d=cells[i];
  d.className='c'+(g.open?' open':'');d.innerHTML='';
  if(g.open&&g.mine)d.innerHTML='<span class="ic">&#128163;</span>';
  else if(g.open&&g.n){d.textContent=g.n;d.classList.add('n'+g.n);}
  else if(g.flag)d.innerHTML='<span class="ic">&#128681;</span>';
}

function open(i){
  const g=grid[i];
  if(state==='ready'){layMines(i);state='play';t0=performance.now();
    timer=setInterval(()=>{elapsed=Math.max(1,Math.ceil((performance.now()-t0)/1000));$('time').textContent=elapsed},250);}
  if(state!=='play'||g.flag)return;
  if(g.open){chord(i);return;}
  if(g.mine){g.open=true;draw(i);cells[i].classList.add('boom');return lose();}
  // leeg vakje: buren meteen mee openen
  const todo=[i];
  while(todo.length){
    const j=todo.pop(),h=grid[j];
    if(h.open||h.flag)continue;
    h.open=true;opened++;draw(j);
    if(h.n===0)for(const k of nb(j))if(!grid[k].open)todo.push(k);
  }
  beep(520,0.05);
  if(opened===grid.length-mines)win();
}

// tik op een cijfer met evenveel vlaggen rond: open de rest van de buren
function chord(i){
  const around=nb(i);
  if(around.filter(j=>grid[j].flag).length!==grid[i].n)return;
  for(const j of around)if(!grid[j].open&&!grid[j].flag){open(j);if(state!=='play')return;}
}

function toggleFlag(i){
  const g=grid[i];
  if(g.open||(state!=='play'&&state!=='ready'))return;
  g.flag=!g.flag;flags+=g.flag?1:-1;draw(i);
  $('left').textContent=mines-flags;beep(g.flag?760:380,0.05);
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
}

function stop(){clearInterval(timer);timer=null;elapsed=Math.max(1,Math.ceil((performance.now()-t0)/1000));$('time').textContent=elapsed;}

function lose(){
  state='over';stop();beep(110,0.4,'sawtooth',0.08);
  grid.forEach((g,i)=>{
    if(g.mine&&!g.flag&&!g.open){g.open=true;draw(i);}
    else if(g.flag&&!g.mine)cells[i].classList.add('wrong');
  });
  $('overtitle').textContent='Boem!';$('final').textContent=opened;
  $('overmsg').textContent=(opened===1?'vakje':'vakjes')+' open van de '+(grid.length-mines);
  overTimer=setTimeout(()=>{$('over').hidden=false;$('again').focus();},1100);
}

function win(){
  state='over';stop();
  grid.forEach((g,i)=>{if(g.mine&&!g.flag){g.flag=true;draw(i);}});
  $('left').textContent=0;
  [523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,0.12),k*110));
  const rec=!best||elapsed<best;
  if(rec){best=elapsed;try{localStorage.setItem(bestKey(level),best)}catch(e){}showBest();}
  $('overtitle').textContent='Gewonnen!';$('final').textContent=elapsed;
  $('overmsg').textContent=(elapsed===1?'seconde':'seconden')+(rec?' · nieuw record!':'');
  overTimer=setTimeout(()=>{$('over').hidden=false;$('again').focus();},700);
}

// tikken en lang indrukken
let press=null;
const board=$('board');
// Safari zelf niets laten doen met aanrakingen op het veld (geen zoom bij dubbel tikken, geen menu bij lang drukken).
// Het spel gebruikt pointer-events, die blijven gewoon werken.
board.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
board.addEventListener('dblclick',e=>e.preventDefault());
board.addEventListener('pointerdown',e=>{
  const d=e.target.closest('.c');if(!d||e.button===2)return;
  const i=+d.dataset.i;
  press={i,x:e.clientX,y:e.clientY,long:false,
    t:setTimeout(()=>{if(press&&press.i===i){press.long=true;toggleFlag(i);}},380)};
});
board.addEventListener('pointermove',e=>{
  if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>12){clearTimeout(press.t);press=null;}
});
board.addEventListener('pointerup',e=>{
  if(!press)return;clearTimeout(press.t);
  const p=press;press=null;
  if(p.long)return;
  const g=grid[p.i];
  if(flagMode&&!g.open)toggleFlag(p.i);else open(p.i);
});
board.addEventListener('pointercancel',()=>{if(press){clearTimeout(press.t);press=null;}});
board.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const d=e.target.closest('.c');
  if(d&&e.pointerType!=='touch'&&!(press&&press.long))toggleFlag(+d.dataset.i);
});

function setMode(f){flagMode=f;$('dig').setAttribute('aria-pressed',!f);$('flag').setAttribute('aria-pressed',f);}
$('dig').addEventListener('click',()=>setMode(false));
$('flag').addEventListener('click',()=>setMode(true));

function start(){$('start').hidden=true;$('over').hidden=true;reset();setMode(false);}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
$('restart').addEventListener('click',()=>{$('over').hidden=true;reset();});
$('change').addEventListener('click',()=>{$('over').hidden=true;$('start').hidden=false;$('go').focus();});

setLevel(level);reset();
</script>

</body></html>
