<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: score bovenaan, vierkant speelveld in het midden, panelen erover */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --panel:#1d2440;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;pointer-events:none}
#score{font-family:var(--display);font-size:clamp(44px,12vw,72px);line-height:1;font-variant-numeric:tabular-nums}
#best{margin-top:6px;font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;color:var(--muted);
  font-size:13px;letter-spacing:.08em;pointer-events:none;transition:opacity .4s}
.sndbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;background:rgba(11,15,29,.62)}
.overlay[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:28px 24px;max-width:320px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--bg-deep)}
.panel h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.ver{font-size:12px;color:var(--muted);letter-spacing:.08em}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
button{font-family:var(--display);font-size:20px;color:var(--bg-deep);background:var(--accent);border:0;border-radius:4px;
  padding:14px 18px;cursor:pointer;box-shadow:0 5px 0 #b86e14}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b86e14}
.levels{display:flex;gap:6px}
.levels button{flex:1;font-size:14px;padding:10px 4px;color:var(--fg);background:transparent;border:2px solid #2f3860;box-shadow:none}
.levels button[aria-pressed="true"]{color:var(--bg-deep);background:var(--accent);border-color:var(--accent)}
.levels button:active{transform:none}
button.link{font-family:var(--body);font-size:14px;color:var(--muted);background:none;box-shadow:none;padding:4px;text-decoration:underline}
button.link:active{transform:none}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.home{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  width:40px;height:40px;display:grid;place-items:center;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);text-decoration:none;font-size:20px}
.home:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head><body>

<div id="wrap">
  <a class="home" href="../../" aria-label="Terug naar alle games">&larr;</a>
  <button class="sndbtn" aria-label="Geluid aan of uit"></button>
  <canvas id="c"></canvas>
  <div class="hud">
    <div id="score">0</div>
    <div id="best">Record 0</div>
  </div>
  <div class="hint" id="hint">Veeg om te sturen</div>

  <div class="overlay" id="start">
    <div class="panel">
      <h1>Snake</h1>
      <p>Veeg over het scherm of gebruik de pijltjestoetsen. Eet het oranje fruit om te groeien. Raak de muur of je eigen staart niet.</p>
      <div class="levels" role="group" aria-label="Snelheid">
        <button data-level="traag">Traag</button>
        <button data-level="normaal">Normaal</button>
        <button data-level="snel">Snel</button>
      </div>
      <button id="go">Start</button>
      <div class="ver">Versie <span id="ver"></span></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h1>Game over</h1>
      <div class="big" id="final">0</div>
      <p id="overmsg">punten</p>
      <button id="again">Opnieuw</button>
      <button class="link" id="change">Andere snelheid</button>
    </div>
  </div>
</div>

<script src="../../version.js?v=4.6"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
try{$('ver').textContent=SITE_VERSION}catch(e){}

const N=17;                       // speelveld is N×N vakjes
let W,H,dpr,cell,ox,oy;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const top=Math.max(120,H*0.15), bottom=Math.max(56,H*0.07);
  cell=Math.floor(Math.min(W-24,H-top-bottom)/N);
  ox=Math.round((W-cell*N)/2); oy=Math.round(top+(H-top-bottom-cell*N)/2);
}
addEventListener('resize',resize);resize();

/* snelheid: tijd per stap aan het begin, kortste tijd, en hoeveel sneller per fruit (ms) */
const LEVELS={
  traag:  {start:270,min:140,per:3, key:'snake-best-traag', name:'Traag'},
  normaal:{start:150,min:65, per:4, key:'snake-best',       name:'Normaal'},
  snel:   {start:100,min:45, per:3, key:'snake-best-snel',  name:'Snel'},
};
let level='normaal'; try{const l=localStorage.getItem('snake-level');if(LEVELS[l])level=l}catch(e){}
let best=0;
function setLevel(l){
  level=l;try{localStorage.setItem('snake-level',l)}catch(e){}
  best=0;try{best=+localStorage.getItem(LEVELS[l].key)||0}catch(e){}
  $('best').textContent='Record '+best+' · '+LEVELS[l].name;
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.level===l));
}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>setLevel(b.dataset.level)));
setLevel(level);

let snake,dir,queue,food,score,state='start',acc=0,eatPulse=0,dead=null;
const stepMs=()=>{const L=LEVELS[level];return Math.max(L.min,L.start-score*L.per)};

function reset(){
  const m=Math.floor(N/2);
  snake=[{x:m-2,y:m},{x:m-3,y:m},{x:m-4,y:m}];
  dir={x:1,y:0};queue=[];score=0;acc=0;eatPulse=0;dead=null;
  $('score').textContent=0;placeFood();
}
function placeFood(){
  const free=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)
    if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
  food=free.length?free[Math.floor(Math.random()*free.length)]:null;
}

/* geluid: kleine piep, start pas na de eerste tik */
let ac=null;
function beep(f,d=0.09,type='triangle',v=0.12){
  if(window.SITE_SOUND&&!SITE_SOUND.on)return;   // geluid uitgezet
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

// richtingen in een wachtrij, zodat twee snelle bochten na elkaar allebei tellen
function turn(x,y){
  if(state!=='play')return;
  const last=queue.length?queue[queue.length-1]:dir;
  if((x===last.x&&y===last.y)||(x===-last.x&&y===-last.y))return;
  if(queue.length<3)queue.push({x,y});
  $('hint').style.opacity=0;
}

function step(){
  if(queue.length)dir=queue.shift();
  const h=snake[0], n={x:h.x+dir.x,y:h.y+dir.y};
  const eats=food&&n.x===food.x&&n.y===food.y;
  const body=eats?snake:snake.slice(0,-1);   // de staart schuift op als je niet eet
  if(n.x<0||n.y<0||n.x>=N||n.y>=N||body.some(s=>s.x===n.x&&s.y===n.y)){dead=n;return end();}
  snake.unshift(n);
  if(eats){
    score++;$('score').textContent=score;eatPulse=1;
    beep(440*Math.pow(1.06,Math.min(score,24)),0.1);
    placeFood();
    if(!food)return end();
  }else snake.pop();
}

function end(){
  state='over';beep(110,0.4,'sawtooth',0.08);
  const rec=score>best;
  if(rec){best=score;try{localStorage.setItem(LEVELS[level].key,best)}catch(e){}}
  $('best').textContent='Record '+best+' · '+LEVELS[level].name;
  $('final').textContent=score;
  $('overmsg').textContent=(score===1?'punt':'punten')+(rec&&score>0?' · nieuw record!':'');
  setTimeout(()=>{$('over').hidden=false;$('again').focus();},700);
}

function start(){$('start').hidden=true;$('over').hidden=true;reset();state='play';beep(520,0.08);}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
$('change').addEventListener('click',()=>{$('over').hidden=true;$('start').hidden=false;$('go').focus();});

// vegen: zodra de vinger ver genoeg beweegt telt het als bocht, daarna opnieuw meten
let sx=null,sy=null;
$('wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('.overlay,.home,.sndbtn'))return;
  sx=e.clientX;sy=e.clientY;
});
$('wrap').addEventListener('pointermove',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy));
  sx=e.clientX;sy=e.clientY;
});
addEventListener('pointerup',()=>{sx=sy=null});
addEventListener('pointercancel',()=>{sx=sy=null});

const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
addEventListener('keydown',e=>{
  const k=KEYS[e.code];
  if(k&&state==='play'){e.preventDefault();turn(k[0],k[1]);}
});

function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();}

let last=performance.now();
function frame(t){
  const dt=Math.min(t-last,100);last=t;
  if(state==='play'){acc+=dt;while(acc>=stepMs()&&state==='play'){acc-=stepMs();step();}}

  ctx.fillStyle='#141a2e';ctx.fillRect(0,0,W,H);
  // speelveld met zacht dambordpatroon
  ctx.fillStyle='#10162a';ctx.fillRect(ox,oy,cell*N,cell*N);
  ctx.fillStyle='rgba(255,255,255,0.025)';
  for(let y=0;y<N;y++)for(let x=(y%2);x<N;x+=2)ctx.fillRect(ox+x*cell,oy+y*cell,cell,cell);
  ctx.strokeStyle='#2f3860';ctx.lineWidth=2;ctx.strokeRect(ox-1,oy-1,cell*N+2,cell*N+2);

  if(food){
    const p=1+Math.sin(t/180)*0.08, r=cell*0.36*p;
    ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(ox+(food.x+.5)*cell,oy+(food.y+.5)*cell,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#7bd88f';rrect(ox+(food.x+.5)*cell,oy+food.y*cell+cell*0.08,cell*0.22,cell*0.14,2);
  }

  const pad=Math.max(1,cell*0.08);
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i], l=62-Math.min(i,20)*0.9;
    ctx.fillStyle=`hsl(${150+Math.min(i,30)*2},55%,${l}%)`;
    rrect(ox+s.x*cell+pad,oy+s.y*cell+pad,cell-pad*2,cell-pad*2,cell*0.25);
  }
  // ogen in de kijkrichting
  const h=snake[0], cx=ox+(h.x+.5)*cell, cy=oy+(h.y+.5)*cell, d=dir;
  ctx.fillStyle='#0b0f1d';
  for(const sgn of[-1,1]){
    const ex=cx+d.x*cell*0.18+(-d.y)*sgn*cell*0.2, ey=cy+d.y*cell*0.18+d.x*sgn*cell*0.2;
    ctx.beginPath();ctx.arc(ex,ey,Math.max(1.5,cell*0.08),0,Math.PI*2);ctx.fill();
  }
  if(eatPulse>0){
    ctx.strokeStyle=`rgba(255,255,255,${eatPulse})`;ctx.lineWidth=2;
    const p=(1-eatPulse)*cell*0.6;ctx.strokeRect(ox+h.x*cell-p,oy+h.y*cell-p,cell+p*2,cell+p*2);
    eatPulse=Math.max(0,eatPulse-dt/300);
  }
  if(dead&&state==='over'){
    ctx.fillStyle='rgba(255,90,90,0.55)';
    const x=Math.max(0,Math.min(N-1,dead.x)), y=Math.max(0,Math.min(N-1,dead.y));
    ctx.fillRect(ox+x*cell,oy+y*cell,cell,cell);
  }
  requestAnimationFrame(frame);
}
reset();requestAnimationFrame(frame);
</script>

</body></html>
