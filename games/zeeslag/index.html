<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zeeslag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: tellers bovenaan, dan de melding, het grote veld van de vijand en daaronder (of ernaast op een breed scherm)
   je eigen vloot in het klein met de lijst van vijandelijke schepen. Bij het opstellen zie je alleen je eigen vloot, groot. */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --panel:#1d2440;
  --water:#22305a; --ship:#6f7fb8; --hit:#ff7a7a; --sunk:#b8434f;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  --cb:30px; --cs:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(12px,env(safe-area-inset-left,0px))}
.top{width:100%;max-width:520px;height:44px;flex:none;display:grid;grid-template-columns:40px 1fr 1fr 1fr 40px 40px;align-items:center;gap:6px}
.stat{text-align:center;line-height:1}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#best{flex:none;margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.stage{flex:1;min-height:0;width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
#msg{flex:none;height:40px;display:grid;place-items:center;font-weight:600;font-size:15px;line-height:20px;text-align:center;text-wrap:balance}
#msg.good{color:#7bd88f} #msg.bad{color:var(--hit)}
#area{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.wide #area{flex-direction:row;align-items:flex-start;justify-content:center;gap:16px}
.side{display:flex;gap:12px;align-items:flex-start}
.wide .side{flex-direction:column;gap:8px}
.sea h2,.fleet h2{margin:0 0 4px;height:14px;font-size:11px;line-height:14px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(10,var(--c));gap:2px;padding:4px;background:var(--bg-deep);border-radius:6px}
#enemy{--c:var(--cb)} #own{--c:var(--cs)}
.setup #own{--c:var(--cb)}
.c{position:relative;width:var(--c);height:var(--c);border:0;padding:0;border-radius:calc(var(--c) * .14);background:var(--water);display:block}
button.c{cursor:pointer}
button.c:disabled{cursor:default}
@media (hover:hover){#enemy.live button.c:not(:disabled):hover{box-shadow:0 0 0 2px var(--accent) inset}}
.c:focus-visible{outline:3px solid var(--fg);outline-offset:1px;z-index:1}
.c.ship{background:var(--ship)}
.c.miss::after,.c.auto::after{content:'';position:absolute;inset:36%;border-radius:50%;background:var(--muted)}
.c.auto::after{opacity:.35}
.c.hit{background:var(--hit)}
.c.hit::after{content:'';position:absolute;inset:30%;border-radius:50%;background:var(--fg)}
.c.sunk{background:linear-gradient(45deg,transparent 42%,var(--bg-deep) 42% 58%,transparent 58%),
  linear-gradient(-45deg,transparent 42%,var(--bg-deep) 42% 58%,transparent 58%),var(--sunk)}
.c.reveal{background:var(--ship);opacity:.6}
.c.last{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}}
/* de vijandelijke vloot: een balkje per schip, rood zodra het gezonken is */
.fleet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.fleet li{display:flex;gap:2px}
.fleet i{width:11px;height:11px;border-radius:2px;background:var(--ship)}
.fleet li.gone i{background:var(--sunk);opacity:.8}
.setupbar{flex:none;display:none;gap:8px;width:100%;max-width:340px}
.setupbar button{font-family:var(--display);font-size:16px;border:0;border-radius:4px;padding:12px 10px;cursor:pointer}
#shuffle{flex:1;color:var(--fg);background:#2a3358;box-shadow:0 4px 0 #1a2140}
#ready{flex:1;color:var(--bg-deep);background:var(--accent);box-shadow:0 4px 0 #b86e14}
.setupbar button:active{transform:translateY(3px);box-shadow:0 1px 0 #1a2140}
#ready:active{box-shadow:0 1px 0 #b86e14}
.setup .setupbar{display:flex}
.wide .setupbar{flex-direction:column;width:150px;align-self:center}
.setup #enemysea,.setup .fleet{display:none}
.home{width:40px;height:40px;display:grid;place-items:center;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);text-decoration:none;font-size:20px}
.home:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.restart{width:40px;height:40px;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);border:0;font-size:20px;cursor:pointer;padding:0}
/* de terugknop blijft boven de pop-ups, zodat je altijd naar het overzicht kunt */
.home{position:relative;z-index:5}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;background:rgba(11,15,29,.62)}
.overlay[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:28px 24px;max-width:330px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--bg-deep)}
.panel h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.ver{font-size:12px;color:var(--muted);letter-spacing:.08em}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.panel > button{font-family:var(--display);font-size:20px;color:var(--bg-deep);background:var(--accent);border:0;border-radius:4px;
  padding:14px 18px;cursor:pointer;box-shadow:0 5px 0 #b86e14}
.panel > button:active{transform:translateY(4px);box-shadow:0 1px 0 #b86e14}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.levels{display:flex;gap:6px}
.levels button{flex:1;font-family:var(--display);font-size:13px;padding:10px 2px;color:var(--fg);background:transparent;border:2px solid #2f3860;border-radius:4px;cursor:pointer}
.levels button[aria-pressed="true"]{color:var(--bg-deep);background:var(--accent);border-color:var(--accent)}
.panel > button.link{font-family:var(--body);font-size:14px;color:var(--muted);background:none;box-shadow:none;padding:4px;text-decoration:underline}
.panel > button.link:active{transform:none}
/* laag scherm (telefoon op zijn kant): minder lucht, compacter paneel */
@media (max-height:520px){
  #best{display:none}
  .stage{gap:2px;margin-top:2px}
  #msg{height:22px;font-size:14px;white-space:nowrap}
  .panel{padding:14px 18px;gap:8px;max-width:460px}
  .panel h1{font-size:22px}
  .panel p{font-size:14px;line-height:1.3}
  .big{font-size:34px}
  .panel > button{padding:10px 18px;font-size:18px}
}
</style>
</head><body>

<div id="wrap">
  <div class="top">
    <a class="home" href="../../" aria-label="Terug naar alle games">&larr;</a>
    <div class="stat"><b id="shots">0</b><span>Schoten</span></div>
    <div class="stat"><b id="eleft">5</b><span>Vijand</span></div>
    <div class="stat"><b id="mleft">5</b><span>Jij</span></div>
    <button class="sndbtn" aria-label="Geluid aan of uit"></button>
    <button class="restart" id="restart" aria-label="Opnieuw beginnen">&#8635;</button>
  </div>
  <div id="best">Record –</div>
  <div class="stage setup" id="stage">
    <div id="msg" aria-live="polite"></div>
    <div id="area">
      <div class="sea" id="enemysea"><h2>Vijandelijke wateren</h2><div class="grid" id="enemy"></div></div>
      <div class="side">
        <div class="sea"><h2>Jouw vloot</h2><div class="grid" id="own"></div></div>
        <div class="fleet"><h2>Vijand</h2><ul id="fleet" aria-label="Schepen van de vijand"></ul></div>
      </div>
      <div class="setupbar">
        <button id="shuffle">Schud</button>
        <button id="ready">Vaar uit</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="start">
    <div class="panel">
      <h1>Zeeslag</h1>
      <p>Jij en de computer verstoppen elk vijf schepen. Schiet om de beurt op een vakje. Wie het eerst de hele vloot van de ander tot zinken brengt, wint.</p>
      <div class="levels" role="group" aria-label="Moeilijkheid">
        <button data-level="makkelijk">Makkelijk</button>
        <button data-level="normaal">Normaal</button>
        <button data-level="moeilijk">Moeilijk</button>
      </div>
      <button id="go">Start</button>
      <div class="ver">Versie <span id="ver"></span></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h1 id="overtitle">Gewonnen!</h1>
      <div class="big" id="final">0</div>
      <p id="overmsg">schoten</p>
      <button id="again">Opnieuw</button>
      <button class="link" id="change">Andere moeilijkheid</button>
    </div>
  </div>
</div>

<script src="../../version.js?v=8.4"></script>
<script>
const $=id=>document.getElementById(id);
try{$('ver').textContent=SITE_VERSION}catch(e){}

/* veld van 10 × 10, vakje i = rij × 10 + kolom. Schepen raken elkaar niet, ook niet schuin. */
const N=10;
const FLEET=[{n:5,name:'vliegdekschip'},{n:4,name:'slagschip'},{n:3,name:'kruiser'},{n:3,name:'onderzeeër'},{n:2,name:'patrouilleboot'}];
const LEVELS={makkelijk:'Makkelijk',normaal:'Normaal',moeilijk:'Moeilijk'};
const coord=i=>'ABCDEFGHIJ'[i%N]+(Math.floor(i/N)+1);
// record: gewonnen in zo weinig mogelijk schoten, per moeilijkheid
const bestKey=l=>'zeeslag-best-'+l;
// wat er op een vakje geschoten is
const NONE=0,MISS=1,HIT=2,SUNK=3,AUTO=4;   // AUTO: water rond een gezonken schip, vanzelf afgestreept

let level='normaal'; try{const l=localStorage.getItem('zeeslag-level');if(LEVELS[l])level=l}catch(e){}
let me,foe,turn,state='start',shots=0,best=0,cpuTimer=null,overTimer=null;
let eCells=[],oCells=[];

function readBest(l){try{return +localStorage.getItem(bestKey(l))||0}catch(e){return 0}}
function showBest(){$('best').textContent='Record '+(best?best+' schoten':'–')+' · '+LEVELS[level];}
function setLevel(l){
  level=l;try{localStorage.setItem('zeeslag-level',l)}catch(e){}
  best=readBest(l);showBest();
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.level===l));
}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>setLevel(b.dataset.level)));

/* geluid: kleine piep, start pas na de eerste tik */
let ac=null;
function beep(f,d=0.09,type='triangle',v=0.12){
  if(window.SITE_SOUND&&!SITE_SOUND.on)return;   // geluid uitgezet
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

const rnd=n=>Math.floor(Math.random()*n);
function around(i,diag){ // de buren van een vakje, met of zonder de schuine
  const r=Math.floor(i/N),c=i%N,out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc||(!diag&&dr&&dc))continue;
    const rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<N&&cc>=0&&cc<N)out.push(rr*N+cc);
  }
  return out;
}
function span(r,c,horiz,n){ // de vakjes van een schip, of null als het buiten het veld valt
  if((horiz?c:r)+n>N)return null;
  return [...Array(n)].map((_,k)=>horiz?r*N+c+k:(r+k)*N+c);
}
function makeSide(){ // een vloot op een willekeurige plek
  for(;;){
    const grid=new Int8Array(N*N).fill(-1), ships=[];
    let ok=true;
    for(const f of FLEET){
      let cells=null;
      for(let t=0;t<300&&!cells;t++){
        const s=span(rnd(N),rnd(N),Math.random()<.5,f.n);
        if(s&&s.every(i=>grid[i]<0&&around(i,true).every(j=>grid[j]<0)))cells=s;
      }
      if(!cells){ok=false;break;}
      cells.forEach(i=>grid[i]=ships.length);
      ships.push({n:f.n,name:f.name,cells,hits:0});
    }
    if(ok)return {grid,ships,shot:new Uint8Array(N*N),last:-1};
  }
}
const left=side=>side.ships.filter(s=>s.hits<s.n).length;

/* één schot op een vakje van 'side' */
function fire(side,i){
  if(side.shot[i])return null;
  side.last=i;
  const k=side.grid[i];
  if(k<0){side.shot[i]=MISS;return {hit:false,sunk:null};}
  const s=side.ships[k];s.hits++;side.shot[i]=HIT;
  if(s.hits<s.n)return {hit:true,sunk:null};
  for(const c of s.cells)side.shot[c]=SUNK;
  for(const c of s.cells)for(const j of around(c,true))if(!side.shot[j])side.shot[j]=AUTO;
  return {hit:true,sunk:s};
}

/* de computer kiest een vakje op jouw veld.
   Voor elk schip dat nog drijft telt hij op hoeveel manieren het over een vakje kan liggen; een ligging over een treffer telt zwaar. */
function density(){
  const k=me.shot, d=new Float64Array(N*N);
  for(const s of me.ships)if(s.hits<s.n){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const hz of [true,false]){
      const cells=span(r,c,hz,s.n);if(!cells)continue;
      let w=1,ok=true;
      for(const i of cells){if(k[i]===HIT)w*=40;else if(k[i]!==NONE){ok=false;break;}}
      if(ok)for(const i of cells)if(k[i]===NONE)d[i]+=w;
    }
  }
  return d;
}
function pickMax(d){
  let top=-1,pick=[];
  for(let i=0;i<N*N;i++)if(me.shot[i]===NONE){if(d[i]>top){top=d[i];pick=[i];}else if(d[i]===top)pick.push(i);}
  return pick[rnd(pick.length)];
}
function cpuPick(){
  const free=[],open=[];
  for(let i=0;i<N*N;i++){if(me.shot[i]===NONE)free.push(i);else if(me.shot[i]===HIT)open.push(i);}
  if(level==='moeilijk')return pickMax(density());
  if(level==='normaal'){
    if(open.length)return pickMax(density());          // een geraakt schip afmaken
    const par=free.filter(i=>(i%N+Math.floor(i/N))%2===0); // zoeken in dambordpatroon
    const pool=par.length?par:free;return pool[rnd(pool.length)];
  }
  // makkelijk: schiet in het wilde weg, en zoekt maar soms verder naast een treffer
  if(open.length&&Math.random()<.6){
    const near=[...new Set(open.flatMap(i=>around(i,false)))].filter(i=>me.shot[i]===NONE);
    if(near.length)return near[rnd(near.length)];
  }
  return free[rnd(free.length)];
}

/* de vakjes worden één keer gemaakt; daarna veranderen alleen hun klassen */
function build(){
  const mk=(el,tag)=>{el.innerHTML='';return [...Array(N*N)].map((_,i)=>{const c=document.createElement(tag);c.className='c';c.dataset.i=i;if(tag==='button')c.type='button';el.appendChild(c);return c;});};
  eCells=mk($('enemy'),'button');oCells=mk($('own'),'div');
}
const WORD={[NONE]:'',[MISS]:'mis',[HIT]:'raak',[SUNK]:'gezonken',[AUTO]:'water'};
const CLS={[NONE]:'',[MISS]:' miss',[HIT]:' hit',[SUNK]:' sunk',[AUTO]:' auto'};
function draw(){
  const live=state==='play'&&turn==='me';
  $('enemy').classList.toggle('live',live);
  eCells.forEach((c,i)=>{
    const v=foe.shot[i];
    c.className='c'+CLS[v]+(state==='over'&&!v&&foe.grid[i]>=0?' reveal':'')+(i===foe.last?' last':'');
    c.disabled=!live||v!==NONE;
    c.setAttribute('aria-label',coord(i)+(v?', '+WORD[v]:''));
  });
  oCells.forEach((c,i)=>{
    const v=me.shot[i];
    c.className='c'+(v===HIT||v===SUNK?CLS[v]:(me.grid[i]>=0?' ship':'')+CLS[v])+(i===me.last?' last':'');
  });
  $('fleet').innerHTML=foe.ships.map(s=>`<li class="${s.hits===s.n?'gone':''}" aria-label="${s.name}, ${s.n} vakjes${s.hits===s.n?', gezonken':''}">${'<i></i>'.repeat(s.n)}</li>`).join('');
  $('shots').textContent=shots;$('eleft').textContent=left(foe);$('mleft').textContent=left(me);
}
function say(t,cls){const el=$('msg');el.textContent=t;el.className=cls||'';}

/* de grootte van de vakjes volgt uit de ruimte die er echt is; op een breed scherm staan de velden naast elkaar */
function fit(){
  const st=$('stage'), a=$('area'), s=document.documentElement.style;
  st.classList.remove('wide');
  const W=a.clientWidth, H=a.clientHeight, cap=44, cellOf=outer=>Math.floor((outer-26)/10);
  if(st.classList.contains('setup')){ // knoppen onder het veld, of ernaast als dat een groter veld geeft
    const under=cellOf(Math.min(W,H-18-12-50)), beside=cellOf(Math.min(H-18,W-16-150));
    st.classList.toggle('wide',beside>under);
    s.setProperty('--cb',Math.max(12,Math.min(cap,Math.max(under,beside)))+'px');return;
  }
  const tall=cellOf(Math.min(W,(H-48)/1.5)), wide=cellOf(Math.min(H-18,(W-16)/1.5));
  const cb=Math.max(12,Math.min(cap,Math.max(tall,wide)));
  st.classList.toggle('wide',wide>tall);
  s.setProperty('--cb',cb+'px');
  s.setProperty('--cs',Math.max(6,Math.floor(((10*cb+26)/2-26)/10))+'px');
}
addEventListener('resize',fit);

function setup(){ // nieuwe vloot voor allebei; jij mag de jouwe nog schudden
  clearTimeout(cpuTimer);clearTimeout(overTimer);
  me=makeSide();foe=makeSide();shots=0;turn='me';state='setup';
  $('stage').classList.add('setup');
  say('Dit is jouw vloot. Schud tot je tevreden bent en vaar dan uit.');
  draw();fit();
}
function begin(){
  state='play';turn='me';
  $('stage').classList.remove('setup');
  say('Jouw beurt: tik op een vakje van de vijand.');
  draw();fit();
}

function shoot(i){
  if(state!=='play'||turn!=='me')return;
  const r=fire(foe,i);if(!r)return;
  shots++;
  if(r.sunk){say('Gezonken: het '+r.sunk.name+'!','good');[523,659,784].forEach((f,k)=>setTimeout(()=>beep(f,0.1),k*90));}
  else if(r.hit){say('Raak!','good');beep(660,0.1);}
  else{say('Mis.');beep(200,0.12,'sine',0.1);}
  if(!left(foe))return finish(true);
  turn='cpu';draw();
  cpuTimer=setTimeout(cpuTurn,850);
}
function cpuTurn(){
  if(state!=='play')return;
  const i=cpuPick(), r=fire(me,i);
  if(r.sunk){say('De computer brengt je '+r.sunk.name+' tot zinken. Jouw beurt.','bad');[330,262,196].forEach((f,k)=>setTimeout(()=>beep(f,0.12,'sawtooth',0.06),k*110));}
  else if(r.hit){say('De computer raakt je op '+coord(i)+'. Jouw beurt.','bad');beep(240,0.12,'sawtooth',0.06);}
  else say('De computer mist op '+coord(i)+'. Jouw beurt.');
  if(!left(me))return finish(false);
  turn='me';draw();
}

function finish(won){
  state='over';clearTimeout(cpuTimer);
  draw();
  const rec=won&&(!best||shots<best);
  if(rec){best=shots;try{localStorage.setItem(bestKey(level),best)}catch(e){}showBest();}
  if(won)[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,0.12),350+k*110));
  else say('Je hele vloot is gezonken.','bad');
  $('overtitle').textContent=won?'Gewonnen!':'Verloren';
  $('final').hidden=!won;$('final').textContent=shots;
  $('overmsg').textContent=won?'schoten'+(rec?' · nieuw record!':''):'De computer had nog '+(left(foe)===1?'1 schip':left(foe)+' schepen')+' over. Ze staan nu op het veld.';
  overTimer=setTimeout(()=>{$('over').hidden=false;$('again').focus();},won?1200:1800);
}

$('enemy').addEventListener('click',e=>{const c=e.target.closest('button.c');if(c&&!c.disabled)shoot(+c.dataset.i);});
$('shuffle').addEventListener('click',()=>{if(state!=='setup')return;me=makeSide();beep(440,0.05);draw();});
$('ready').addEventListener('click',()=>{if(state==='setup')begin();});

function start(){$('start').hidden=true;$('over').hidden=true;setup();}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
$('restart').addEventListener('click',()=>{$('over').hidden=true;setup();});
$('change').addEventListener('click',()=>{$('over').hidden=true;$('start').hidden=false;$('go').focus();});

setLevel(level);build();setup();
</script>
