<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blokken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: score bovenaan, speelveld 8×8 in het midden, drie blokken eronder, panelen erover */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --panel:#1d2440;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;touch-action:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);margin:0 auto;padding:0 12px;max-width:520px;height:64px;
  display:grid;grid-template-columns:86px 1fr 86px;align-items:center;gap:6px;pointer-events:none}
.stat{text-align:center;line-height:1}
#score{display:block;font-family:var(--display);font-weight:400;font-size:clamp(36px,10vw,52px);font-variant-numeric:tabular-nums}
#best{display:block;margin-top:4px;font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.home,.menu{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);text-decoration:none;font-size:20px;border:0;padding:0;cursor:pointer}
.home:focus-visible,.menu:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
/* de terugknop blijft boven de pop-ups, zodat je altijd naar het overzicht kunt */
.home{position:relative;z-index:5}
.right{display:flex;justify-content:flex-end;gap:6px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;background:rgba(11,15,29,.62)}
.overlay[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:28px 24px;max-width:320px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--bg-deep)}
.panel h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.ver{font-size:12px;color:var(--muted);letter-spacing:.08em}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.panel > button{font-family:var(--display);font-size:20px;color:var(--bg-deep);background:var(--accent);border:0;border-radius:4px;
  padding:14px 18px;cursor:pointer;box-shadow:0 5px 0 #b86e14}
.panel > button:active{transform:translateY(4px);box-shadow:0 1px 0 #b86e14}
.panel > button.alt{background:transparent;color:var(--fg);border:2px solid var(--accent);box-shadow:none;font-size:16px;padding:10px}
.panel > button[hidden]{display:none}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head><body>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="top" id="top">
    <a class="home" href="../../" aria-label="Terug naar alle games">&larr;</a>
    <div class="stat"><b id="score">0</b><span id="best">Record 0</span></div>
    <div class="right"><button class="sndbtn" aria-label="Geluid aan of uit"></button><button class="menu" id="menu" aria-label="Menu">&#9776;</button></div>
  </div>

  <div class="overlay" id="start">
    <div class="panel">
      <h1>Blokken</h1>
      <p>Sleep de blokken op het veld. Een volle rij of kolom verdwijnt. Maak meerdere lijnen tegelijk of na elkaar voor combo-punten. Past er geen blok meer, dan is het gedaan.</p>
      <button id="go">Nieuw spel</button>
      <button class="alt" id="resume" hidden>Verder spelen</button>
      <div class="ver">Versie <span id="ver"></span></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h1>Geen plek meer</h1>
      <div class="big" id="final">0</div>
      <p id="overmsg">punten</p>
      <button id="again">Opnieuw</button>
    </div>
  </div>
</div>

<script src="../../version.js?v=4.7"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
try{$('ver').textContent=SITE_VERSION}catch(e){}

const N=8;
const COLORS=['#ff7a7a','#ffb347','#ffe066','#7bd88f','#4fd1c5','#6cb6ff','#b48cff','#ff8fd1'];

/* ---------- blokken: basisvormen, alle draaiingen en spiegelingen ---------- */
const BASE=[
  {s:[[0,0]],w:5},
  {s:[[0,0],[1,0]],w:6},{s:[[0,0],[1,0],[2,0]],w:6},{s:[[0,0],[1,0],[2,0],[3,0]],w:5},{s:[[0,0],[1,0],[2,0],[3,0],[4,0]],w:3},
  {s:[[0,0],[1,0],[0,1],[1,1]],w:6},{s:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]],w:2},
  {s:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],w:3},
  {s:[[0,0],[0,1],[1,1]],w:5},
  {s:[[0,0],[0,1],[0,2],[1,2]],w:4},
  {s:[[0,0],[0,1],[0,2],[1,2],[2,2]],w:3},
  {s:[[0,0],[1,0],[2,0],[1,1]],w:4},
  {s:[[1,0],[2,0],[0,1],[1,1]],w:3},
  {s:[[0,0],[1,1]],w:2},{s:[[0,0],[1,1],[2,2]],w:1},
];
function norm(c){const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);}
const SHAPES=[];
for(const b of BASE){
  const seen=new Set();let c=b.s;
  const vars=[];
  for(let m=0;m<2;m++){for(let r=0;r<4;r++){c=c.map(([x,y])=>[-y,x]);const n=norm(c),k=JSON.stringify(n);if(!seen.has(k)){seen.add(k);vars.push(n);}}c=c.map(([x,y])=>[-x,y]);}
  for(const v of vars)SHAPES.push({cells:v,w:b.w/vars.length,W:Math.max(...v.map(p=>p[0]))+1,H:Math.max(...v.map(p=>p[1]))+1});
}
const TOTALW=SHAPES.reduce((a,s)=>a+s.w,0);
function randShape(){let q=Math.random()*TOTALW;for(const s of SHAPES){if((q-=s.w)<=0)return s;}return SHAPES[0];}

/* ---------- toestand ---------- */
let grid,tray,score,combo,sinceClear,best=0,state='start',fx=[],texts=[],drag=null,shake=0;
try{best=+localStorage.getItem('blokken-best')||0}catch(e){}
$('best').textContent='Record '+best;

function fits(sh,gx,gy){
  for(const [x,y] of sh.cells){const X=gx+x,Y=gy+y;if(X<0||Y<0||X>=N||Y>=N||grid[Y*N+X])return false;}
  return true;
}
function canPlaceAnywhere(sh){for(let y=0;y<=N-sh.H;y++)for(let x=0;x<=N-sh.W;x++)if(fits(sh,x,y))return true;return false;}
function newTray(){
  // probeer een set waarvan minstens één blok nog past
  for(let t=0;t<30;t++){
    tray=[0,1,2].map(()=>({sh:randShape(),col:COLORS[Math.floor(Math.random()*COLORS.length)]}));
    if(tray.some(p=>canPlaceAnywhere(p.sh)))return;
  }
}

/* ---------- opslaan ---------- */
function save(){
  try{
    if(state!=='play')return;
    localStorage.setItem('blokken-save',JSON.stringify({grid,score,combo,sinceClear,
      tray:tray.map(p=>p&&{i:SHAPES.indexOf(p.sh),col:p.col})}));
  }catch(e){}
}
function loadSave(){try{const s=JSON.parse(localStorage.getItem('blokken-save'));return s&&s.grid?s:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem('blokken-save')}catch(e){}}

/* ---------- geluid ---------- */
let ac=null;
function beep(f,d=0.07,type='triangle',v=0.09){
  if(window.SITE_SOUND&&!SITE_SOUND.on)return;   // geluid uitgezet
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

/* ---------- maten ---------- */
let W,H,dpr,cs,bx,by,trayY,slotW,tcs;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const top=$('top').getBoundingClientRect().bottom+16, bottom=28;
  const avH=H-top-bottom;
  // het veld krijgt ongeveer 8 delen, de lade eronder ongeveer 3,6 delen
  cs=Math.floor(Math.min((Math.min(W,560)-24)/N,avH/(N+3.6)));
  bx=Math.round((W-cs*N)/2);by=Math.round(top+(avH-cs*(N+3.6))/2);
  trayY=by+cs*N+cs*1.8;slotW=Math.min(W-24,cs*N+40)/3;tcs=Math.min(cs*0.5,slotW/5.4);
}
addEventListener('resize',resize);resize();

function slotCenter(k){return [W/2+(k-1)*slotW,trayY];}

/* ---------- spelverloop ---------- */
function newGame(){
  grid=new Array(N*N).fill(0);score=0;combo=0;sinceClear=0;fx=[];texts=[];
  newTray();begin();
}
function begin(){
  $('start').hidden=true;$('over').hidden=true;state='play';
  $('score').textContent=score;save();
  if(!tray.some(p=>p&&canPlaceAnywhere(p.sh)))gameOver();
}
function resume(){
  const s=loadSave();if(!s)return newGame();
  grid=s.grid;score=s.score;combo=s.combo||0;sinceClear=s.sinceClear||0;fx=[];texts=[];
  tray=s.tray.map(p=>p&&SHAPES[p.i]?{sh:SHAPES[p.i],col:p.col}:null);
  if(tray.every(p=>!p))newTray();
  begin();
}

function place(k,gx,gy){
  const p=tray[k];
  for(const [x,y] of p.sh.cells)grid[(gy+y)*N+gx+x]=p.col;
  tray[k]=null;
  let pts=p.sh.cells.length;
  // volle rijen en kolommen zoeken
  const rows=[],cols=[];
  for(let i=0;i<N;i++){
    let r=true,c=true;
    for(let j=0;j<N;j++){if(!grid[i*N+j])r=false;if(!grid[j*N+i])c=false;}
    if(r)rows.push(i);if(c)cols.push(i);
  }
  const lines=rows.length+cols.length;
  if(lines){
    // combo blijft lopen zolang je binnen 3 zetten opnieuw een lijn maakt
    combo=sinceClear<3&&combo>0?combo+1:1;sinceClear=0;
    const clear=new Set();
    for(const r of rows)for(let j=0;j<N;j++)clear.add(r*N+j);
    for(const c of cols)for(let j=0;j<N;j++)clear.add(j*N+c);
    for(const i of clear){fx.push({x:i%N,y:Math.floor(i/N),col:grid[i],t:0.45});grid[i]=0;}
    const bonus=10*lines*lines*combo;pts+=bonus;
    let msg=lines>1?lines+' lijnen!':'';
    if(combo>1)msg=(msg?msg+' ':'')+'Combo ×'+combo;
    if(grid.every(v=>!v)){pts+=300;msg='Bord leeg! +300';}
    if(msg)texts.push({text:msg,t:1.3});
    texts.push({text:'+'+bonus,t:1,small:true,x:bx+(gx+p.sh.W/2)*cs,y:by+(gy+p.sh.H/2)*cs});
    shake=Math.min(0.25,0.08*lines);
    [523,659,784,1047].slice(0,Math.min(4,lines+combo)).forEach((f,i)=>setTimeout(()=>beep(f,0.1),i*70));
  }else{sinceClear++;if(sinceClear>=3)combo=0;beep(330,0.05);}
  score+=pts;$('score').textContent=score;
  if(tray.every(t=>!t))newTray();
  save();
  if(!tray.some(t=>t&&canPlaceAnywhere(t.sh)))setTimeout(gameOver,600);
}

function gameOver(){
  if(state!=='play')return;
  state='over';clearSave();beep(130,0.4,'sawtooth',0.07);
  const rec=score>best;
  if(rec){best=score;try{localStorage.setItem('blokken-best',best)}catch(e){}}
  $('best').textContent='Record '+best;
  $('final').textContent=score;
  $('overmsg').textContent=(score===1?'punt':'punten')+(rec&&score>0?' · nieuw record!':'');
  setTimeout(()=>{$('over').hidden=false;$('again').focus();},500);
}

/* ---------- slepen ---------- */
// waar het blok op het veld zou landen, gerekend vanaf zijn linkerbovenhoek
function target(d){
  const sh=tray[d.k].sh;
  const left=d.x-sh.W*cs/2, topY=d.y-sh.H*cs/2;
  const gx=Math.round((left-bx)/cs), gy=Math.round((topY-by)/cs);
  return fits(sh,gx,gy)?[gx,gy]:null;
}
$('wrap').addEventListener('pointerdown',e=>{
  if(state!=='play'||e.target.closest('.overlay,.home,.menu,.sndbtn'))return;
  for(let k=0;k<3;k++){
    if(!tray[k])continue;
    const [sx,sy]=slotCenter(k);
    if(Math.abs(e.clientX-sx)<slotW/2&&Math.abs(e.clientY-sy)<cs*1.8){
      e.preventDefault();
      // op een telefoon hangt het blok boven je vinger, zodat je het blijft zien
      const lift=e.pointerType==='mouse'?0:cs*1.2+tray[k].sh.H*cs/2;
      drag={k,lift,x:e.clientX,y:e.clientY-lift,id:e.pointerId};
      beep(520,0.03);
      return;
    }
  }
});
addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){drag.x=e.clientX;drag.y=e.clientY-drag.lift;}});
addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  const t=target(d);
  if(t)place(d.k,t[0],t[1]);
});
addEventListener('pointercancel',()=>{drag=null;});

/* ---------- tekenen ---------- */
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v+amt*255)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function tile(x,y,s,col,alpha=1){
  const p=Math.max(1,s*0.06), r=s*0.16;
  ctx.globalAlpha=alpha;
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(x+p,y+p,s-2*p,s-2*p,r):ctx.rect(x+p,y+p,s-2*p,s-2*p);ctx.fill();
  ctx.fillStyle=shade(col,0.18);ctx.fillRect(x+p+r*0.6,y+p+s*0.08,s-2*p-r*1.2,s*0.12);
  ctx.fillStyle=shade(col,-0.22);ctx.fillRect(x+p+r*0.6,y+s-p-s*0.12,s-2*p-r*1.2,s*0.08);
  ctx.globalAlpha=1;
}

function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#141a2e';ctx.fillRect(0,0,W,H);
  if(!grid)return;
  let ox=0,oy=0;if(shake>0){shake-=dt;ox=(Math.random()-0.5)*8*shake/0.25;oy=(Math.random()-0.5)*8*shake/0.25;}
  ctx.translate(ox,oy);

  // veld
  ctx.fillStyle='#0b0f1d';ctx.beginPath();ctx.roundRect?ctx.roundRect(bx-6,by-6,cs*N+12,cs*N+12,8):ctx.rect(bx-6,by-6,cs*N+12,cs*N+12);ctx.fill();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    ctx.fillStyle='#1a2140';const p=Math.max(1,cs*0.06);
    ctx.fillRect(bx+x*cs+p,by+y*cs+p,cs-2*p,cs-2*p);
  }

  // voorbeeld van waar het blok landt, plus lijnen die zouden verdwijnen
  let ghost=null,glow=new Set();
  if(drag){
    const t=target(drag);
    if(t){
      const sh=tray[drag.k].sh;ghost={gx:t[0],gy:t[1],sh,col:tray[drag.k].col};
      const g2=grid.slice();for(const [x,y] of sh.cells)g2[(t[1]+y)*N+t[0]+x]=1;
      for(let i=0;i<N;i++){
        let r=true,c=true;for(let j=0;j<N;j++){if(!g2[i*N+j])r=false;if(!g2[j*N+i])c=false;}
        if(r)for(let j=0;j<N;j++)glow.add(i*N+j);
        if(c)for(let j=0;j<N;j++)glow.add(j*N+i);
      }
    }
  }
  for(let i=0;i<N*N;i++){
    const x=bx+(i%N)*cs,y=by+Math.floor(i/N)*cs;
    if(grid[i])tile(x,y,cs,glow.has(i)&&ghost?ghost.col:grid[i]);
  }
  if(ghost)for(const [x,y] of ghost.sh.cells)tile(bx+(ghost.gx+x)*cs,by+(ghost.gy+y)*cs,cs,ghost.col,0.4);

  // weggespeelde vakjes krimpen weg
  for(const f of fx){
    f.t-=dt;const k=Math.max(0,f.t/0.45),s=cs*k;
    tile(bx+f.x*cs+(cs-s)/2,by+f.y*cs+(cs-s)/2,s,f.col,k);
  }
  fx=fx.filter(f=>f.t>0);

  // lade
  for(let k=0;k<3;k++){
    const p=tray[k];if(!p||(drag&&drag.k===k))continue;
    const [sx,sy]=slotCenter(k), ok=state!=='play'||canPlaceAnywhere(p.sh);
    const ox2=sx-p.sh.W*tcs/2, oy2=sy-p.sh.H*tcs/2;
    for(const [x,y] of p.sh.cells)tile(ox2+x*tcs,oy2+y*tcs,tcs,ok?p.col:'#3a4266',ok?1:0.7);
  }
  // het blok dat je sleept
  if(drag){
    const p=tray[drag.k], s=cs*0.92;
    const ox2=drag.x-p.sh.W*s/2, oy2=drag.y-p.sh.H*s/2;
    for(const [x,y] of p.sh.cells)tile(ox2+x*s,oy2+y*s,s,p.col,0.95);
  }

  // teksten
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of texts){
    t.t-=dt;ctx.globalAlpha=Math.max(0,Math.min(1,t.t*2));
    if(t.small){ctx.fillStyle='#f4f0e6';ctx.font=`400 ${Math.round(cs*0.5)}px Bungee, Impact, sans-serif`;ctx.fillText(t.text,t.x,t.y-(1-t.t)*30);}
    else{ctx.fillStyle='#ffb347';ctx.font=`400 ${Math.round(cs*0.7)}px Bungee, Impact, sans-serif`;ctx.fillText(t.text,bx+cs*N/2,by-cs*0.1-(1.3-t.t)*20);}
  }
  ctx.globalAlpha=1;
  texts=texts.filter(t=>t.t>0);
}

let last=performance.now();
function loop(t){const dt=Math.min((t-last)/1000,0.05);last=t;draw(dt);requestAnimationFrame(loop);}

$('go').addEventListener('click',newGame);
$('resume').addEventListener('click',resume);
$('again').addEventListener('click',newGame);
$('menu').addEventListener('click',()=>{if(state==='play'){save();state='pause';}showStart();});
function showStart(){
  const s=loadSave();$('resume').hidden=!s;
  if(s)$('resume').textContent='Verder spelen · '+s.score+' punten';
  $('start').hidden=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

// achter het startscherm al een leeg veld tonen
grid=new Array(N*N).fill(0);tray=[null,null,null];score=0;
showStart();requestAnimationFrame(loop);
</script>

</body></html>
