<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: tellers bovenaan, kaarten in het midden, panelen erover */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --panel:#1d2440;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  --card:72px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
.top{width:100%;max-width:520px;height:44px;display:grid;grid-template-columns:44px 1fr 1fr 44px;align-items:center;gap:8px}
.stat{text-align:center;line-height:1}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
#best{margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.stage{flex:1;width:100%;display:grid;place-items:center;min-height:0}
#board{display:grid;gap:8px;touch-action:manipulation}
.card{width:var(--card);height:var(--card);perspective:600px;cursor:pointer;border:0;padding:0;background:none}
.card:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:8px}
.inner{position:relative;width:100%;height:100%;transition:transform .35s cubic-bezier(.3,.7,.4,1);transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8px;display:grid;place-items:center;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.back{background:#2a3358;box-shadow:inset 0 -4px 0 #1d2440, inset 0 2px 0 #36406a}
.back::after{content:'';width:34%;height:34%;border-radius:50%;border:3px solid #3a4574}
.front{background:#f4f0e6;transform:rotateY(180deg);font-size:calc(var(--card) * .56);line-height:1;
  font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.card.done .front{background:#e9f7ec;box-shadow:0 0 0 3px #7bd88f inset}
.card.done{animation:pop .35s ease-out}
.card.miss .front{box-shadow:0 0 0 3px #ff7a7a inset}
@keyframes pop{50%{transform:scale(1.08)}}
.home{width:40px;height:40px;display:grid;place-items:center;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);text-decoration:none;font-size:20px}
.home:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.restart{width:40px;height:40px;border-radius:4px;background:rgba(29,36,64,.7);color:var(--fg);border:0;font-size:20px;cursor:pointer;padding:0}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;background:rgba(11,15,29,.62)}
.overlay[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:28px 24px;max-width:320px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--bg-deep)}
.panel h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.ver{font-size:12px;color:var(--muted);letter-spacing:.08em}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.panel > button{font-family:var(--display);font-size:20px;color:var(--bg-deep);background:var(--accent);border:0;border-radius:4px;
  padding:14px 18px;cursor:pointer;box-shadow:0 5px 0 #b86e14}
.panel > button:active{transform:translateY(4px);box-shadow:0 1px 0 #b86e14}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.levels{display:flex;gap:6px}
.levels button{flex:1;font-family:var(--display);font-size:13px;padding:10px 2px;color:var(--fg);background:transparent;border:2px solid #2f3860;border-radius:4px;cursor:pointer}
.levels button[aria-pressed="true"]{color:var(--bg-deep);background:var(--accent);border-color:var(--accent)}
.panel > button.link{font-family:var(--body);font-size:14px;color:var(--muted);background:none;box-shadow:none;padding:4px;text-decoration:underline}
.panel > button.link:active{transform:none}
</style>
</head><body>

<div id="wrap">
  <div class="top">
    <a class="home" href="../../" aria-label="Terug naar alle games">&larr;</a>
    <div class="stat"><b id="turns">0</b><span>Beurten</span></div>
    <div class="stat"><b id="time">0</b><span>Tijd</span></div>
    <button class="restart" id="restart" aria-label="Opnieuw beginnen">&#8635;</button>
  </div>
  <div id="best">Record –</div>
  <div class="stage"><div id="board" aria-label="Kaarten"></div></div>

  <div class="overlay" id="start">
    <div class="panel">
      <h1>Memory</h1>
      <p>Draai telkens twee kaarten om. Zijn ze hetzelfde, dan blijven ze open liggen. Vind alle paren in zo weinig mogelijk beurten.</p>
      <div class="levels" role="group" aria-label="Moeilijkheid">
        <button data-level="makkelijk">Makkelijk</button>
        <button data-level="normaal">Normaal</button>
        <button data-level="moeilijk">Moeilijk</button>
      </div>
      <button id="go">Start</button>
      <div class="ver">Versie <span id="ver"></span></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h1>Alle paren gevonden!</h1>
      <div class="big" id="final">0</div>
      <p id="overmsg">beurten</p>
      <button id="again">Opnieuw</button>
      <button class="link" id="change">Andere moeilijkheid</button>
    </div>
  </div>
</div>

<script src="../../version.js?v=3.2"></script>
<script>
const $=id=>document.getElementById(id);
try{$('ver').textContent=SITE_VERSION}catch(e){}

/* moeilijkheid: kolommen × rijen (staand scherm) */
const LEVELS={
  makkelijk:{cols:3,rows:4,name:'Makkelijk'},
  normaal:  {cols:4,rows:4,name:'Normaal'},
  moeilijk: {cols:5,rows:6,name:'Moeilijk'},
};
const ANIMALS=['🐶','🐱','🦊','🐼','🐸','🐵','🦁','🐯','🐨','🐷','🐰','🐻','🐔','🐙','🦄','🐢','🐳','🦉','🐝','🦋','🐞','🦀','🐧','🦒'];
const bestKey=l=>'memory-best-'+l;

let level='makkelijk'; try{const l=localStorage.getItem('memory-level');if(LEVELS[l])level=l}catch(e){}
let cols,rows,deck,cards,open=[],found,turns,state='start',t0=0,elapsed=0,timer=null,overTimer=null,missTimer=null,best=0;

function readBest(l){try{return +localStorage.getItem(bestKey(l))||0}catch(e){return 0}}
function showBest(){$('best').textContent='Record '+(best?best+' beurten':'–')+' · '+LEVELS[level].name;}
function setLevel(l){
  level=l;try{localStorage.setItem('memory-level',l)}catch(e){}
  best=readBest(l);showBest();
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.level===l));
}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{setLevel(b.dataset.level);reset();}));

/* geluid: kleine piep, start pas na de eerste tik */
let ac=null;
function beep(f,d=0.09,type='triangle',v=0.12){
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// op een breed scherm draaien we het veld een kwartslag
function fit(){
  const L=LEVELS[level], wide=innerWidth>innerHeight*1.1;
  cols=wide?L.rows:L.cols; rows=wide?L.cols:L.rows;
  const w=$('wrap'), gap=8;
  const availW=Math.min(innerWidth-24,900), availH=innerHeight-w.querySelector('.top').offsetHeight-$('best').offsetHeight-60;
  const size=Math.floor(Math.min((availW-gap*(cols-1))/cols,(availH-gap*(rows-1))/rows,120));
  document.documentElement.style.setProperty('--card',Math.max(40,size)+'px');
  $('board').style.gridTemplateColumns=`repeat(${cols},var(--card))`;
}
addEventListener('resize',fit);

function reset(){
  clearInterval(timer);clearTimeout(overTimer);clearTimeout(missTimer);timer=null;
  const L=LEVELS[level], pairs=L.cols*L.rows/2;
  const pics=shuffle(ANIMALS.slice()).slice(0,pairs);
  deck=shuffle([...pics,...pics]);
  open=[];found=0;turns=0;elapsed=0;state='ready';
  $('turns').textContent=0;$('time').textContent=0;
  const b=$('board');b.innerHTML='';
  cards=deck.map((pic,i)=>{
    const c=document.createElement('button');c.className='card';c.dataset.i=i;c.setAttribute('aria-label','Kaart '+(i+1));
    c.innerHTML='<div class="inner"><div class="face back"></div><div class="face front"></div></div>';
    c.querySelector('.front').textContent=pic;
    b.appendChild(c);return c;
  });
  fit();
}

function flipBack(){
  clearTimeout(missTimer);missTimer=null;
  for(const i of open)cards[i].classList.remove('up','miss');
  open=[];
}

function pick(i){
  if(state!=='ready'&&state!=='play')return;
  const c=cards[i];
  if(c.classList.contains('done'))return;
  if(open.length===2)flipBack();        // derde tik: de twee foute meteen terugdraaien
  if(open.includes(i))return;
  if(state==='ready'){state='play';t0=performance.now();
    timer=setInterval(()=>{elapsed=Math.floor((performance.now()-t0)/1000);$('time').textContent=elapsed},250);}
  c.classList.add('up');c.setAttribute('aria-label',deck[i]);open.push(i);beep(420,0.05);
  if(open.length<2)return;
  turns++;$('turns').textContent=turns;
  const [a,b]=open;
  if(deck[a]===deck[b]){
    for(const k of open){cards[k].classList.add('done');}
    open=[];found++;
    setTimeout(()=>beep(660,0.08),120);setTimeout(()=>beep(880,0.1),220);
    if(found===deck.length/2)win();
  }else{
    for(const k of open)cards[k].classList.add('miss');
    missTimer=setTimeout(flipBack,900);
  }
}
$('board').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)pick(+c.dataset.i);});

function win(){
  state='over';clearInterval(timer);timer=null;
  elapsed=Math.max(1,Math.round((performance.now()-t0)/1000));$('time').textContent=elapsed;
  const rec=!best||turns<best;
  if(rec){best=turns;try{localStorage.setItem(bestKey(level),best)}catch(e){}showBest();}
  [523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,0.12),300+k*110));
  $('final').textContent=turns;
  $('overmsg').textContent='beurten · '+elapsed+' s'+(rec?' · nieuw record!':'');
  overTimer=setTimeout(()=>{$('over').hidden=false;$('again').focus();},900);
}

function start(){$('start').hidden=true;$('over').hidden=true;reset();}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
$('restart').addEventListener('click',()=>{$('over').hidden=true;reset();});
$('change').addEventListener('click',()=>{$('over').hidden=true;$('start').hidden=false;$('go').focus();});

setLevel(level);reset();
</script>

</body></html>
