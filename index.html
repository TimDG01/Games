<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games</title>
<meta name="description" content="Een verzameling kleine browsergames.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Zelfde huisstijl als de games: donkerblauw, oranje accent, Bungee + Outfit */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --accent-deep:#b86e14; --panel:#1d2440;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:960px;margin:0 auto;flex:1}

header{margin-bottom:36px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,84px);line-height:.95;margin:0}
h1 span{color:var(--accent)}
.intro{margin:12px 0 0;color:var(--muted);font-size:17px;line-height:1.45;max-width:46ch}

.grid{list-style:none;margin:0;padding:0;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:flex;flex-direction:column;height:100%;background:var(--panel);border:2px solid transparent;border-radius:6px;
  color:inherit;text-decoration:none;overflow:hidden;box-shadow:6px 6px 0 var(--bg-deep);transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{border-color:var(--accent);transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--bg-deep)}
.card:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--bg-deep)}
.card:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.thumb{aspect-ratio:16/9;display:block;width:100%}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;margin:0}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.play{font-family:var(--display);letter-spacing:0;font-size:15px;color:var(--bg-deep);background:var(--accent);border-radius:4px;
  padding:6px 12px;box-shadow:0 3px 0 var(--accent-deep)}
.best{color:var(--accent)}

footer{max-width:960px;width:100%;margin:40px auto 0;color:var(--muted);font-size:13px;letter-spacing:.08em}
.soon{border:2px dashed #2f3860;border-radius:6px;display:grid;place-items:center;min-height:200px;padding:24px;text-align:center;
  color:var(--muted);font-size:15px}

</style>
</head>
<body>
<main>
  <header>
    <h1>Games<span>.</span></h1>
    <p class="intro">Kleine spelletjes voor tussendoor. Werken op je telefoon en op de computer, zonder installatie.</p>
  </header>

  <ul class="grid" id="games"></ul>
</main>
<footer>Versie <span id="version"></span></footer>

<script src="version.js?v=2.4"></script>
<script>
document.getElementById('version').textContent = SITE_VERSION;
/*
  Een nieuwe game toevoegen:
  1. Zet de game in games/<naam>/index.html
  2. Voeg hieronder een regel toe aan GAMES.
     - bestKey (optioneel): localStorage-sleutel waar de game het record bewaart
     - thumb: SVG-inhoud voor een viewBox van 160×90
*/
const GAMES = [
  {
    title: 'Toren Stapelaar',
    href: 'games/toren-stapelaar/',
    description: 'Laat schuivende blokken op elkaar vallen. Wat over de rand hangt, valt eraf. Hoe hoog kom jij?',
    tag: 'Behendigheid',
    bestKey: 'stapel-best',
    bestLabel: n => n === 1 ? '1 verdieping' : n + ' verdiepingen',
    thumb: `
      <rect width="160" height="90" fill="#10162a"/>
      <rect y="78" width="160" height="12" fill="#1a2038"/>
      <rect x="50" y="68" width="60" height="10" fill="hsl(200,65%,60%)"/>
      <rect x="54" y="58" width="52" height="10" fill="hsl(206,65%,60%)"/>
      <rect x="54" y="48" width="44" height="10" fill="hsl(212,65%,60%)"/>
      <rect x="58" y="38" width="40" height="10" fill="hsl(218,65%,60%)"/>
      <rect x="58" y="28" width="40" height="10" fill="hsl(224,65%,60%)"/>
      <rect x="92" y="14" width="40" height="10" fill="hsl(230,65%,64%)"/>
      <rect x="112" y="40" width="8" height="10" fill="hsl(212,65%,55%)" transform="rotate(18 116 45)"/>`
  },
  {
    title: 'Snake',
    href: 'games/snake/',
    description: 'De klassieker. Stuur de slang naar het fruit en word langer, zonder de muur of je eigen staart te raken.',
    tag: 'Klassieker',
    bestKey: 'snake-best',
    bestLabel: n => n === 1 ? '1 punt' : n + ' punten',
    thumb: `
      <rect width="160" height="90" fill="#10162a"/>
      <rect x="34" y="50" width="12" height="12" rx="3" fill="hsl(170,55%,48%)"/>
      <rect x="46" y="50" width="12" height="12" rx="3" fill="hsl(166,55%,50%)"/>
      <rect x="58" y="50" width="12" height="12" rx="3" fill="hsl(162,55%,52%)"/>
      <rect x="70" y="50" width="12" height="12" rx="3" fill="hsl(158,55%,54%)"/>
      <rect x="70" y="38" width="12" height="12" rx="3" fill="hsl(156,55%,56%)"/>
      <rect x="70" y="26" width="12" height="12" rx="3" fill="hsl(154,55%,58%)"/>
      <rect x="82" y="26" width="12" height="12" rx="3" fill="hsl(152,55%,60%)"/>
      <rect x="94" y="26" width="12" height="12" rx="3" fill="hsl(150,55%,62%)"/>
      <circle cx="102" cy="30" r="1.6" fill="#0b0f1d"/><circle cx="102" cy="34" r="1.6" fill="#0b0f1d"/>
      <circle cx="124" cy="32" r="5" fill="#ffb347"/>
      <rect x="124" y="25" width="3" height="2" fill="#7bd88f"/>`
  },
  {
    title: 'Mijnenveger',
    href: 'games/mijnenveger/',
    description: 'Open alle vakjes zonder op een mijn te trappen. De cijfers verraden waar ze liggen. Drie moeilijkheden.',
    tag: 'Puzzel',
    bestKey: 'mijnenveger-best-makkelijk',
    bestLabel: n => n + ' s (makkelijk)',
    thumb: `
      <rect width="160" height="90" fill="#10162a"/>
      <g transform="translate(38 9)">
        <rect x="0" y="0" width="84" height="72" rx="3" fill="#2f3860"/>
        <rect x="2" y="2" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="22" y="2" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="42" y="2" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="62" y="2" width="20" height="16" rx="2" fill="#2a3358"/>
        <rect x="2" y="20" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="22" y="20" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="42" y="20" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="62" y="20" width="20" height="16" rx="2" fill="#2a3358"/>
        <rect x="2" y="38" width="18" height="16" rx="2" fill="#10162a"/>
        <rect x="22" y="38" width="18" height="16" rx="2" fill="#2a3358"/>
        <rect x="42" y="38" width="18" height="16" rx="2" fill="#2a3358"/>
        <rect x="62" y="38" width="20" height="16" rx="2" fill="#2a3358"/>
        <rect x="2" y="56" width="18" height="14" rx="2" fill="#2a3358"/>
        <rect x="22" y="56" width="18" height="14" rx="2" fill="#2a3358"/>
        <rect x="42" y="56" width="18" height="14" rx="2" fill="#2a3358"/>
        <rect x="62" y="56" width="20" height="14" rx="2" fill="#2a3358"/>
        <text x="51" y="15" font-family="Arial Black, sans-serif" font-size="12" text-anchor="middle" fill="#6cb6ff">1</text>
        <text x="51" y="33" font-family="Arial Black, sans-serif" font-size="12" text-anchor="middle" fill="#7bd88f">2</text>
        <text x="11" y="51" font-family="Arial Black, sans-serif" font-size="12" text-anchor="middle" fill="#6cb6ff">1</text>
        <text x="31" y="51" font-family="Arial Black, sans-serif" font-size="12" text-anchor="middle" fill="#ff7a7a">3</text>
        <path d="M70 41v10M70 41l7 3-7 3" stroke="#ff7a7a" stroke-width="2" fill="#ff7a7a"/>
        <circle cx="51" cy="63" r="4" fill="#0b0f1d"/><circle cx="51" cy="63" r="2" fill="#ffb347"/>
      </g>`
  },
  {
    title: 'Breakout',
    href: 'games/breakout/',
    description: 'Kaats de bal tegen de stenen en breek ze allemaal. Elk level is nieuw en willekeurig, en het wordt steeds moeilijker.',
    tag: 'Arcade',
    bestKey: 'breakout-best',
    bestLabel: n => n + ' punten',
    thumb: `
      <rect width="160" height="90" fill="#10162a"/>
      <g fill="hsl(330,65%,62%)"><rect x="22" y="12" width="20" height="8" rx="1"/><rect x="44" y="12" width="20" height="8" rx="1"/><rect x="96" y="12" width="20" height="8" rx="1"/><rect x="118" y="12" width="20" height="8" rx="1"/></g>
      <g fill="hsl(344,65%,62%)"><rect x="22" y="22" width="20" height="8" rx="1"/><rect x="44" y="22" width="20" height="8" rx="1"/><rect x="66" y="22" width="28" height="8" rx="1" fill="#5b6380"/><rect x="96" y="22" width="20" height="8" rx="1"/><rect x="118" y="22" width="20" height="8" rx="1"/></g>
      <g fill="hsl(358,65%,62%)"><rect x="44" y="32" width="20" height="8" rx="1"/><rect x="66" y="32" width="28" height="8" rx="1"/><rect x="96" y="32" width="20" height="8" rx="1"/></g>
      <rect x="40" y="56" width="14" height="7" rx="3.5" fill="#6cb6ff"/>
      <circle cx="98" cy="58" r="3.5" fill="#f4f0e6"/>
      <path d="M98 58 L84 74" stroke="#f4f0e6" stroke-opacity=".25" stroke-width="2" stroke-dasharray="2 3"/>
      <rect x="66" y="76" width="34" height="6" rx="3" fill="#ffb347"/>`
  },
];

function readBest(key){
  try { return +localStorage.getItem(key) || 0 } catch(e) { return 0 }
}

const list = document.getElementById('games');
for (const g of GAMES) {
  const best = g.bestKey ? readBest(g.bestKey) : 0;
  const li = document.createElement('li');
  li.innerHTML = `
    <a class="card" href="${g.href}?v=${SITE_VERSION}">
      <svg class="thumb" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g.thumb}</svg>
      <div class="body">
        <h2></h2>
        <p></p>
        <div class="meta">
          <span class="tag"></span>
          <span class="play">Speel</span>
        </div>
      </div>
    </a>`;
  li.querySelector('h2').textContent = g.title;
  li.querySelector('p').textContent = g.description;
  const tag = li.querySelector('.tag');
  if (best > 0) {
    tag.classList.add('best');
    tag.textContent = 'Record: ' + (g.bestLabel ? g.bestLabel(best) : best);
  } else {
    tag.textContent = g.tag || '';
  }
  list.appendChild(li);
}

const soon = document.createElement('li');
soon.innerHTML = '<div class="soon">Binnenkort meer games</div>';
list.appendChild(soon);
</script>
</body>
</html>
