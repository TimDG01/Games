<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games</title>
<meta name="description" content="Een verzameling kleine browsergames.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Zelfde huisstijl als de games: donkerblauw, oranje accent, Bungee + Outfit */
:root{
  --bg:#141a2e; --bg-deep:#0b0f1d; --fg:#f4f0e6; --muted:#9097b5; --accent:#ffb347; --accent-deep:#b86e14; --panel:#1d2440;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 28px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(14px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:960px;margin:0 auto;flex:1}

header{margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,9vw,64px);line-height:.95;margin:0}
h1 span{color:var(--accent)}
.intro{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.45;max-width:46ch}

/* filter op soort game */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filters button{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted);background:transparent;border:2px solid #2f3860;
  border-radius:99px;padding:6px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--bg-deep);background:var(--accent);border-color:var(--accent)}
.filters button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

/* compacte tegels: drie naast elkaar op een telefoon, meer op een breder scherm */
.grid{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.grid li[hidden]{display:none}
.card{display:flex;flex-direction:column;height:100%;background:var(--panel);border:2px solid transparent;border-radius:6px;
  color:inherit;text-decoration:none;overflow:hidden;box-shadow:4px 4px 0 var(--bg-deep);transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{border-color:var(--accent);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--bg-deep)}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--bg-deep)}
.card:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.thumb{aspect-ratio:16/10;display:block;width:100%}
.body{padding:7px 8px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h2{font-family:var(--body);font-weight:600;font-size:14px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.tag{font-size:11px;line-height:1.25;color:var(--muted)}
.best{color:var(--accent)}
@media (min-width:600px){
  .grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .body{padding:10px 12px 12px;gap:3px}
  .card h2{font-size:16px}
  .tag{font-size:12px}
}

footer{max-width:960px;width:100%;margin:32px auto 0;color:var(--muted);font-size:13px;letter-spacing:.08em}

</style>
</head>
<body>
<main>
  <header>
    <h1>Games<span>.</span></h1>
    <p class="intro">Kleine spelletjes voor tussendoor. Werken op je telefoon en op de computer, zonder installatie.</p>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Soort game"></div>
  <ul class="grid" id="games"></ul>
</main>
<footer>Binnenkort meer games · Versie <span id="version"></span></footer>

function readBest(key){
  try { return +localStorage.getItem(key) || 0 } catch(e) { return 0 }
}

const list = document.getElementById('games');
for (const g of GAMES) {
  const best = g.bestKey ? readBest(g.bestKey) : 0;
  const li = document.createElement('li');
  li.dataset.tag = g.tag || '';
  li.innerHTML = `
    <a class="card" href="${g.href}?v=${SITE_VERSION}">
      <svg class="thumb" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g.thumb}</svg>
      <div class="body">
        <h2></h2>
        <span class="tag"></span>
      </div>
    </a>`;
  li.querySelector('a').title = g.description;
  li.querySelector('h2').textContent = g.title;
  const tag = li.querySelector('.tag');
  if (best > 0) {
    tag.classList.add('best');
    tag.textContent = 'Record: ' + (g.bestLabel ? g.bestLabel(best) : best);
  } else {
    tag.textContent = g.tag || '';
  }
  list.appendChild(li);
}

// filterknoppen: Alles, en dan elke soort (de meest voorkomende eerst). De keuze blijft bewaard.
const count = {};
for (const g of GAMES) if (g.tag) count[g.tag] = (count[g.tag] || 0) + 1;
const tags = Object.keys(count).sort((a, b) => count[b] - count[a]);
const filters = document.getElementById('filters');
function show(tag) {
  if (tag && !count[tag]) tag = '';
  for (const li of list.children) li.hidden = !!tag && li.dataset.tag !== tag;
  for (const b of filters.children) b.setAttribute('aria-pressed', b.dataset.tag === tag);
  try { localStorage.setItem('games-filter', tag) } catch(e) {}
}
for (const t of ['', ...tags]) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.tag = t; b.textContent = t || 'Alles';
  b.addEventListener('click', () => show(t));
  filters.appendChild(b);
}
let saved = ''; try { saved = localStorage.getItem('games-filter') || '' } catch(e) {}
show(saved);
</script>
